<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#9D72FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Outer Glow Ring -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8" />

  <!-- Clipboard / Task Box Outline -->
  <rect x="128" y="144" width="256" height="272" rx="40" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="12" />

  <!-- Bold Checkmark Icon -->
  <path d="M184 272 L236 324 L332 208" fill="none" stroke="url(#checkGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Decorative Sparkle Badge -->
  <circle cx="360" cy="144" r="28" fill="#FACC15" />
</svg>
